name: Web CI

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - web/**
      - .github/workflows/web-ci.yml
  pull_request:
    branches:
      - "**"
    paths:
      - web/**
      - .github/workflows/web-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-check:
    name: Web Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build web
        run: npm run build
